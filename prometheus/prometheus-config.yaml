apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-server-conf
  namespace: dev
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['signal-engine-service:8000']